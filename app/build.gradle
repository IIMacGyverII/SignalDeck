plugins {
    id 'com.android.application'
}

// The release key stays off GitHub: its location and passwords come from local.properties (never committed) or the
// environment. Without them the build falls back to the Android debug key, which cannot update an official install.
def signingProps = new Properties()
def localProps = rootProject.file('local.properties')
if (localProps.exists()) localProps.withInputStream { signingProps.load(it) }
def signingValue = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }
def releaseStore = signingValue('signaldeck.storeFile', 'SIGNALDECK_STORE_FILE')

// Build identity for device and transmit-test reports (BuildIdentity.java): which commit, branch and repository a build
// came from, so a fork tester's report says what was tested. Never fails the build: "unknown" when git is not there.
// The remote URL loses any user name, password or token here, so none can reach the APK (BuildIdentity.sanitizeRemote
// does the same again at run time; keep the two in step).
def gitOut = { List<String> args ->
    try {
        def p = (['git'] + args).execute(null, rootProject.projectDir)
        def out = p.inputStream.text.trim(); p.waitFor()
        p.exitValue() == 0 ? out : null
    } catch (Throwable ignored) { null }
}
def sanitizeRemote = { String u ->
    if (!u) return 'unknown'
    u = u.trim().replaceAll('(?i)^([a-z][a-z0-9+.-]*://)[^/@]*@', '$1')                      // scheme://user:token@host -> scheme://host
    u = u.replaceAll('^(?!git@)[^@/:]+@([^:/]+):', '$1:')                                 // other-user@host:path (scp form) -> host:path
    u = u.replaceAll('[?#].*$', '')
    u.replaceAll('(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,})', '<token>')
}
def gitCommitFull = gitOut(['rev-parse', 'HEAD']) ?: 'unknown'
def gitCommit = gitOut(['rev-parse', '--short=10', 'HEAD']) ?: 'unknown'
def gitBranch = gitOut(['rev-parse', '--abbrev-ref', 'HEAD']) ?: 'unknown'
def gitRemote = sanitizeRemote(gitOut(['remote', 'get-url', 'origin']))
def gitStatus = gitOut(['status', '--porcelain', '--untracked-files=no'])
def gitDirty = gitStatus == null ? 'unknown' : (gitStatus.isEmpty() ? 'false' : 'true')
def buildTimeUtc = new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))
def javaString = { String v -> '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"' }

def sdalsaAssets = layout.buildDirectory.dir('generated/sdalsa-assets').get().asFile

android {
    testOptions { unitTests.returnDefaultValues = true }   // host tests: android.util.Log calls in shared DSP code are no-ops
    namespace 'com.macdmr.radio'
    compileSdk 34

    defaultConfig {
        applicationId "com.macdmr.radio"
        minSdk 29
        targetSdk 34
        versionCode 120
        versionName "1.0.0-beta.21"
        buildConfigField 'String', 'GIT_COMMIT', javaString(gitCommit)
        buildConfigField 'String', 'GIT_COMMIT_FULL', javaString(gitCommitFull)
        buildConfigField 'String', 'GIT_BRANCH', javaString(gitBranch)
        buildConfigField 'String', 'GIT_REMOTE', javaString(gitRemote)
        buildConfigField 'String', 'GIT_DIRTY', javaString(gitDirty)
        buildConfigField 'String', 'BUILD_TIME_UTC', javaString(buildTimeUtc)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }   // the phones this radio family ships in are ARM; keeps the Vosk natives to two ABIs
    }

    buildFeatures { buildConfig true }
    ndkVersion '26.3.11579264'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }   // Codec 2 for M17 voice; the sdalsa audio helper
    // sdalsa is an executable: CMake writes it into this folder per ABI and it ships as an asset (sdalsa/<abi>/sdalsa)
    defaultConfig { externalNativeBuild { cmake { arguments "-DSDALSA_ASSET_DIR=${sdalsaAssets.absolutePath.replace(File.separator, '/')}" } } }
    sourceSets { main { assets.srcDirs += sdalsaAssets } }
    // One key for debug and release (the project's release key): adb install -r keeps working across both and users
    // can move from a test build to a release without uninstalling. Official builds are signed with it.
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword signingValue('signaldeck.storePassword', 'SIGNALDECK_STORE_PASSWORD')
                keyAlias signingValue('signaldeck.keyAlias', 'SIGNALDECK_KEY_ALIAS')
                keyPassword signingValue('signaldeck.keyPassword', 'SIGNALDECK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (releaseStore) signingConfig signingConfigs.release }
        release {
            minifyEnabled false
            signingConfig releaseStore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    // Android Auto: knowing when the phone is projecting to a car (audio goes to the car's media channel)
    implementation 'androidx.car.app:app:1.4.0'
    // Media session + browser: the radio as an Android Auto media app and on the lock screen
    implementation 'androidx.media:media:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'   // the real org.json for unit tests (android.jar only has stubs)
    // Unlocks the vendor audio class android.os.PrizeTinyService (hidden API) at runtime
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    // Compile-time stubs of the vendor framework classes; the real ones live in the boot class path
    compileOnly project(':tiny-stubs')
    // On-device live captions (the language model is downloaded on first use, never shipped in the APK)
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}

// -PexportHelp=true makes HelpExportTest write docs/help from the in-app guide instead of checking it
tasks.withType(Test).configureEach {
    systemProperty 'signaldeck.exportHelp', (project.findProperty('exportHelp') ?: 'false').toString()
    systemProperty 'signaldeck.exportRadios', (project.findProperty('exportRadios') ?: 'false').toString()   // RadioNotesExportTest writes docs/radios
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// the assets must be merged after CMake has built the helper for the same build type
tasks.configureEach { t ->
    def m = t.name =~ /^merge(Debug|Release)Assets$/
    if (m.matches()) t.dependsOn("externalNativeBuild${m.group(1)}")
}
